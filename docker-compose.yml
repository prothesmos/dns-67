services:
   dns-server:
      container_name: dns-server
      image: technitium/dns-server:latest
      hostname: dns-67
      ports:
        - "5380:5380/tcp"
        - "53:53/tcp"
        - "53:53/udp"
        - "853:853/tcp"
        - "443:443/tcp"
        - "443:443/udp"
        - "80:80/tcp"
        - "8053:8053/tcp"
        - "67:67/udp"
      environment:
        - DNS_SERVER_DOMAIN=dns-67
        - DNS_SERVER_LOG_FOLDER_PATH=/var/log/technitium/dns
      volumes:
        - config:/etc/dns
        - logs:/var/log/technitium/dns
      restart: unless-stopped
      sysctls:
        - net.ipv4.ip_local_port_range=1024 65535

volumes:
   config:
   logs:

